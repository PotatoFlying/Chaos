<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connexion et création de compte CHAOS!">
    <title>Connexion | CHAOS!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="compte.css">
</head>
<body class="account-page">
    <header class="account-header">
        <a href="index.html" class="account-logo">CHAOS!</a>
        <nav class="account-nav">
            <a href="le-studio.html">LE STUDIO</a>
            <a href="galerie.html">GALERIE</a>
            <a href="boutique.html">COMMANDES</a>
        </nav>
    </header>

    <main class="account-main">
        <section class="account-card">
            <p class="account-eyebrow">WELCOME TO THE CHAOS</p>
            <h1>YOUR ACCOUNT<span>.</span></h1>
            <p class="account-intro">Connecte-toi ou crée ton compte pour suivre tes demandes de créations.</p>

            <div class="account-tabs" role="tablist" aria-label="Connexion ou inscription">
                <button type="button" class="account-tab active" id="tab-login" aria-selected="true">SE CONNECTER</button>
                <button type="button" class="account-tab" id="tab-register" aria-selected="false">CRÉER UN COMPTE</button>
            </div>

            <form id="login-form" class="account-form">
                <label for="login-email">ADRESSE E-MAIL</label>
                <input id="login-email" name="email" type="email" autocomplete="email" placeholder="nom@exemple.com" required>

                <label for="login-password">MOT DE PASSE</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Ton mot de passe" required>

                <button class="account-submit" id="login-submit" type="submit">SE CONNECTER ↗</button>
            </form>

            <form id="register-form" class="account-form" hidden>
                <label for="register-name">PSEUDO</label>
                <input id="register-name" name="name" type="text" autocomplete="nickname" minlength="2" maxlength="40" placeholder="Ton pseudo" required>

                <label for="register-email">ADRESSE E-MAIL</label>
                <input id="register-email" name="email" type="email" autocomplete="email" placeholder="nom@exemple.com" required>

                <label for="register-password">MOT DE PASSE</label>
                <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="6 caractères minimum" required>

                <label for="register-password-confirm">CONFIRMER LE MOT DE PASSE</label>
                <input id="register-password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Répète ton mot de passe" required>

                <button class="account-submit" id="register-submit" type="submit">CRÉER MON COMPTE ↗</button>
            </form>

            <p id="auth-status" class="account-status" role="status" aria-live="polite"></p>
            <p class="account-smallprint">En créant un compte, tu pourras envoyer des demandes de commissions avec ton adresse e-mail associée.</p>
        </section>
    </main>

    <footer class="account-footer">© 2026 CHAOS! — STAY WEIRD.</footer>

    <!-- Charger Supabase dans cet ordre : bibliothèque, configuration, puis logique de la page. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="connexion.js"></script>
</body>
</html>
